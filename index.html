<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Regulations Atlas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
#map{height:500px;width:100%}
body{font-family:Arial,sans-serif;margin:0;padding:20px}
h1{color:#002244}
</style>
</head>
<body>
<h1>Building Regulations Atlas - Test</h1>
<p>If you see a map with blue circles below, it works!</p>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map').setView([5, 20], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
var places = [
    ["Rwanda", -1.9, 29.9],
    ["Ghana", 7.9, -1.0],
    ["Tanzania", -6.4, 34.9],
    ["Senegal", 14.5, -14.5],
    ["Botswana", -22.3, 24.7]
];
for (var i = 0; i < places.length; i++) {
    L.circleMarker([places[i][1], places[i][2]], {
        radius: 20, fillColor: '#1a5a9c', color: '#fff', weight: 3, fillOpacity: 0.9
    }).addTo(map).bindPopup(places[i][0]);
}
console.log("TEST MAP LOADED - 5 markers added");
</script>
</body>
</html>
